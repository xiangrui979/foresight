name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node${{ matrix.node }} · ${{ matrix.os }} · TZ=${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
        tz: ['UTC', 'Asia/Shanghai']
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
