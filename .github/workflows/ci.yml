name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node${{ matrix.node }} · ${{ matrix.os }} · TZ=${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
        tz: ['UTC', 'Asia/Shanghai']
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本来自 packageManager pin
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # 离线 smoke 矩阵守卫（G1 机制清单 C1–C3/C5–C8/C10；单组合跑一次即可）
      - name: smoke matrix (offline)
        if: matrix.node == '24' && matrix.os == 'ubuntu-latest' && matrix.tz == 'UTC'
        run: node eval/smoke.mjs
